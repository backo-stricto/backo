[project]
name = "backo"
version = "0.3.0"
authors = [
  { name="Bertrand Wallrich", email="Bertrand.Wallrich@inria.fr" },
]
description = "Back office low code"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "pyjwt",
  "flask",
  "requests",
  "pyyaml",
  "deepdiff",
  "questionary",
  "python-magic",
  "redis>=8.1.0",
  "python-jsonpath",
  "stricto>=0.2.5"
]

[project.optional-dependencies]
mongo = [
    "pymongo>=4.17.0",
]


[dependency-groups]
dev = [
    "black",
    "coverage",
    "pylint",
]
doc = [
  "sphinx==8.2.3",
  "myst-parser==4.0.1",
  "sphinx_rtd_theme",
  "sphinxcontrib-mermaid==1.2.3",
  "toml"
]

[project.urls]
GitHub = "https://github.com/backo-stricto/backo"
Homepage = "https://github.com/backo-stricto/backo"
Issues = "https://github.com/backo-stricto/backo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
omit = [
    # omit stricto
    "*/stricto/*"
    ]

[tool.hatch.build.targets.sdist]
exclude = [
  "htmlcov",
]
[project.scripts]
backo_init = "backo:backo_init"